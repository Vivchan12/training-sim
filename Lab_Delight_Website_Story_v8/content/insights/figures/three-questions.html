<!-- Carousel for Insight 03. Two lines a card, on the homepage's own hero
     backdrop. 4:5, the ratio LinkedIn wants, so this can also be exported as a
     carousel PDF later without re-laying it out. -->
<figure class="carousel" aria-labelledby="carouselTitle">
  <figcaption class="carousel-cap">
    <p class="carousel-eyebrow" id="carouselTitle">The short version</p>
    <p class="carousel-hint">Swipe, or use the arrows.</p>
  </figcaption>

  <div class="carousel-track" tabindex="0" role="region" aria-label="Three questions before you implement technology or AI">

    <article class="slide slide-dark" aria-label="Card 1 of 8">
      <p class="slide-kicker">Lab Delight</p>
      <div class="slide-mid">
        <p class="slide-lede">Before you implement technology or AI</p>
        <p class="slide-big">Three questions for your teams</p>
      </div>
    </article>

    <article class="slide" aria-label="Card 2 of 8">
      <p class="slide-num">01</p>
      <div class="slide-mid">
        <h3 class="slide-h">Who owns the outcome?</h3>
        <p class="slide-body">Not who owns AI. Who owns the result it is meant to improve.</p>
      </div>
      <p class="slide-foot">The leader</p>
    </article>

    <article class="slide" aria-label="Card 3 of 8">
      <p class="slide-num">02</p>
      <div class="slide-mid">
        <h3 class="slide-h">Is the team prepared to work differently?</h3>
        <p class="slide-body">It takes more than AI skills. It takes a change of mindset.</p>
      </div>
      <p class="slide-foot">The team</p>
    </article>

    <article class="slide" aria-label="Card 4 of 8">
      <p class="slide-num">03</p>
      <div class="slide-mid">
        <h3 class="slide-h">What is worth building?</h3>
        <p class="slide-body">The easier it is to build, the more it matters to decide.</p>
      </div>
      <p class="slide-foot">The people served</p>
    </article>

    <article class="slide" aria-label="Card 5 of 8">
      <p class="slide-kicker">Miss one</p>
      <div class="slide-mid">
        <h3 class="slide-h">An owner without a prepared team</h3>
        <p class="slide-body">A mandate nobody can deliver.</p>
      </div>
    </article>

    <article class="slide" aria-label="Card 6 of 8">
      <p class="slide-kicker">Miss one</p>
      <div class="slide-mid">
        <h3 class="slide-h">A prepared team without an owner</h3>
        <p class="slide-body">Good ideas with no authority behind them.</p>
      </div>
    </article>

    <article class="slide" aria-label="Card 7 of 8">
      <p class="slide-kicker">Miss one</p>
      <div class="slide-mid">
        <h3 class="slide-h">Both, without a clear view of what to build</h3>
        <p class="slide-body">Speed in the wrong direction.</p>
      </div>
    </article>

    <article class="slide slide-dark" aria-label="Card 8 of 8">
      <p class="slide-kicker">In one line</p>
      <div class="slide-mid">
        <p class="slide-big">AI makes building cheaper. It does not make deciding easier.</p>
      </div>
      <p class="slide-foot">Which of the three is hardest in your organisation?</p>
    </article>

  </div>

  <div class="carousel-controls">
    <button type="button" class="carousel-btn" data-carousel="prev" aria-label="Previous card">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8 1L2 8l6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="carousel-count" aria-live="polite" aria-atomic="true"><span data-carousel="current">1</span> / <span data-carousel="total">8</span></p>
    <button type="button" class="carousel-btn" data-carousel="next" aria-label="Next card">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 1l6 7-6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</figure>
