<!-- Carousel for Insight 03. Two lines a card, on the homepage's own hero
     backdrop. 4:5, the ratio LinkedIn wants, so this can also be exported as a
     carousel PDF later without re-laying it out. -->
<figure class="carousel" aria-labelledby="carouselTitle">
  <figcaption class="carousel-cap">
    <p class="carousel-eyebrow" id="carouselTitle">精簡版</p>
    <p class="carousel-hint">左右滑动，或使用箭头。</p>
  </figcaption>

  <div class="carousel-track" data-lenis-prevent tabindex="0" role="region" aria-label="导入技术或 AI 之前的三个问题">

    <article class="slide slide-dark" aria-label="第 1 张，共 8 张">
      <p class="slide-kicker">Lab Delight</p>
      <div class="slide-mid">
        <p class="slide-lede">在你导入技术或 AI 之前</p>
        <p class="slide-big">先问团队三个问题</p>
      </div>
    </article>

    <article class="slide" aria-label="第 2 张，共 8 张">
      <p class="slide-num">01</p>
      <div class="slide-mid">
        <h3 class="slide-h">谁为成果负责？</h3>
        <p class="slide-body">不是谁管 AI，而是谁为这件事要改善的结果负责。</p>
      </div>
      <p class="slide-foot">领导者</p>
    </article>

    <article class="slide" aria-label="第 3 张，共 8 张">
      <p class="slide-num">02</p>
      <div class="slide-mid">
        <h3 class="slide-h">团队准备好换一种方式工作了吗？</h3>
        <p class="slide-body">需要的不只是 AI 技能，而是一次心态的转变。</p>
      </div>
      <p class="slide-foot">团队</p>
    </article>

    <article class="slide" aria-label="第 4 张，共 8 张">
      <p class="slide-num">03</p>
      <div class="slide-mid">
        <h3 class="slide-h">什么才值得做？</h3>
        <p class="slide-body">做起来越容易，决定什么值得做就越重要。</p>
      </div>
      <p class="slide-foot">被服务的人</p>
    </article>

    <article class="slide" aria-label="第 5 张，共 8 张">
      <p class="slide-kicker">少了一个</p>
      <div class="slide-mid">
        <h3 class="slide-h">有负责人，没有准备好的团队</h3>
        <p class="slide-body">一个没人做得动的授权。</p>
      </div>
    </article>

    <article class="slide" aria-label="第 6 张，共 8 张">
      <p class="slide-kicker">少了一个</p>
      <div class="slide-mid">
        <h3 class="slide-h">有准备好的团队，没有负责人</h3>
        <p class="slide-body">好点子背后没有决策权。</p>
      </div>
    </article>

    <article class="slide" aria-label="第 7 张，共 8 张">
      <p class="slide-kicker">少了一个</p>
      <div class="slide-mid">
        <h3 class="slide-h">两者都有，却看不清要做什么</h3>
        <p class="slide-body">往错的方向加速。</p>
      </div>
    </article>

    <article class="slide slide-dark" aria-label="第 8 张，共 8 张">
      <p class="slide-kicker">一句话</p>
      <div class="slide-mid">
        <p class="slide-big">AI 让「做」变便宜了。它没有让「决定」变容易。</p>
      </div>
      <p class="slide-foot">这三个之中，哪一个在你的机构里最难回答？</p>
    </article>

  </div>

  <div class="carousel-controls">
    <button type="button" class="carousel-btn" data-carousel="prev" aria-label="上一张">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8 1L2 8l6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="carousel-count" aria-live="polite" aria-atomic="true"><span data-carousel="current">1</span> / <span data-carousel="total">8</span></p>
    <button type="button" class="carousel-btn" data-carousel="next" aria-label="下一张">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 1l6 7-6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</figure>
