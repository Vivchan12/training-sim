<!-- Carousel for Insight 03. Two lines a card, on the homepage's own hero
     backdrop. 4:5, the ratio LinkedIn wants, so this can also be exported as a
     carousel PDF later without re-laying it out. -->
<figure class="carousel" aria-labelledby="carouselTitle">
  <figcaption class="carousel-cap">
    <p class="carousel-eyebrow" id="carouselTitle">精簡版</p>
    <p class="carousel-hint">左右滑動，或使用箭頭。</p>
  </figcaption>

  <div class="carousel-track" data-lenis-prevent tabindex="0" role="region" aria-label="導入技術或 AI 之前的三個問題">

    <article class="slide slide-dark" aria-label="第 1 張，共 8 張">
      <p class="slide-kicker">Lab Delight</p>
      <div class="slide-mid">
        <p class="slide-lede">在你導入技術或 AI 之前</p>
        <p class="slide-big">先問團隊三個問題</p>
      </div>
    </article>

    <article class="slide" aria-label="第 2 張，共 8 張">
      <p class="slide-num">01</p>
      <div class="slide-mid">
        <h3 class="slide-h">誰為成果負責？</h3>
        <p class="slide-body">不是誰管 AI，而是誰為這件事要改善的結果負責。</p>
      </div>
      <p class="slide-foot">領導者</p>
    </article>

    <article class="slide" aria-label="第 3 張，共 8 張">
      <p class="slide-num">02</p>
      <div class="slide-mid">
        <h3 class="slide-h">團隊準備好換一種方式工作了嗎？</h3>
        <p class="slide-body">需要的不只是 AI 技能，而是一次心態的轉變。</p>
      </div>
      <p class="slide-foot">團隊</p>
    </article>

    <article class="slide" aria-label="第 4 張，共 8 張">
      <p class="slide-num">03</p>
      <div class="slide-mid">
        <h3 class="slide-h">什麼才值得做？</h3>
        <p class="slide-body">做起來越容易，決定什麼值得做就越重要。</p>
      </div>
      <p class="slide-foot">被服務的人</p>
    </article>

    <article class="slide" aria-label="第 5 張，共 8 張">
      <p class="slide-kicker">少了一個</p>
      <div class="slide-mid">
        <h3 class="slide-h">有負責人，沒有準備好的團隊</h3>
        <p class="slide-body">一個沒人做得動的授權。</p>
      </div>
    </article>

    <article class="slide" aria-label="第 6 張，共 8 張">
      <p class="slide-kicker">少了一個</p>
      <div class="slide-mid">
        <h3 class="slide-h">有準備好的團隊，沒有負責人</h3>
        <p class="slide-body">好點子背後沒有決策權。</p>
      </div>
    </article>

    <article class="slide" aria-label="第 7 張，共 8 張">
      <p class="slide-kicker">少了一個</p>
      <div class="slide-mid">
        <h3 class="slide-h">兩者都有，卻看不清要做什麼</h3>
        <p class="slide-body">往錯的方向加速。</p>
      </div>
    </article>

    <article class="slide slide-dark" aria-label="第 8 張，共 8 張">
      <p class="slide-kicker">一句話</p>
      <div class="slide-mid">
        <p class="slide-big">AI 讓「做」變便宜了。它沒有讓「決定」變容易。</p>
      </div>
      <p class="slide-foot">這三個之中，哪一個在你的機構裡最難回答？</p>
    </article>

  </div>

  <div class="carousel-controls">
    <button type="button" class="carousel-btn" data-carousel="prev" aria-label="上一張">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M8 1L2 8l6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="carousel-count" aria-live="polite" aria-atomic="true"><span data-carousel="current">1</span> / <span data-carousel="total">8</span></p>
    <button type="button" class="carousel-btn" data-carousel="next" aria-label="下一張">
      <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 1l6 7-6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</figure>
